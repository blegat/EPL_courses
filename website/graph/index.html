<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Interactive graph of EPL course topics">
    <title>EPL course graph</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fbfafc; }
      #graph-canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100dvh; outline: none; background: #fbfafc; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 1rem system-ui; color: #504c5a; }
    </style>
    <link data-trunk rel="rust" data-cargo-manifest="Cargo.toml">
  </head>
  <body>
    <div id="loading">Loading course graph…</div>
    <canvas id="graph-canvas"></canvas>
  </body>
</html>
